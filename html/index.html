<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Statut GPU — nvidia-smi</title>
<script>
	(function () {
		var endpoint = '/cgi-bin/nvidia-smi.sh';
		var interval = 2000;
		
		function refresh() {
			fetch(endpoint, { cache: 'no-store' })
				.then(function (r) { return r.text(); })
				.then(function (t) {
					var pre = document.getElementById('nvidia-smi');
					var last = document.getElementById('last');
					pre.textContent = t;
					last.textContent = 'Dernière mise à jour : ' + new Date().toLocaleTimeString();
				})
				.catch(function (e) {
					var pre = document.getElementById('nvidia-smi');
					pre.textContent = 'Erreur de récupération\n' + e.message;
				});
		}
		setInterval(refresh, interval);
	})();
</script>
</head>
<body>
	<pre id="nvidia-smi">Chargement…</pre>
	<div id="last"></div>
</body>
</html>
