<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Statut GPU — nvidia-smi</title>
<script>
	(function () {
		function refresh() {
			var endpoint = '/cgi-bin/nvidia-smi.sh';
			fetch(endpoint, { cache: 'no-store' })
				.then(function (r) { return r.text(); })
				.then(function (t) {
					var pre = document.getElementById('nvidia-smi');
					pre.textContent = t;
				})
				.catch(function (e) {
					var pre = document.getElementById('nvidia-smi');
					pre.textContent = 'Erreur de récupération\n' + e.message;
				});
		}
		setInterval(refresh, 2000);
	})();

	function restart_llama() {
		var b = document.getElementById('restart');
		var log = document.getElementById('log');
		b.textContent = 'Relance en cours…';
		fetch('/cgi-bin/restart-llama-serve.sh', { cache: 'no-store' })
			.then(function (r) { return r.text(); })
			.then(function (t) {
				log.textContent = t;
				b.textContent = 'Relancer llama-serve';
			})
			.catch(function (e) {
				log.textContent = e.message;
			});
	}
</script>
</head>
<body>
	<pre id="nvidia-smi">Chargement…</pre>
	<button id="restart" onclick="restart_llama()">Relancer llama-serve</button>
	<pre id="log"></pre>
</body>
</html>
