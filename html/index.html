<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Statut GPU — nvidia-smi</title>
<script>
	(function () {
		function refresh() {
			var endpoint = '/cgi-bin/nvidia-smi.sh';
			fetch(endpoint, { cache: 'no-store' })
				.then(function (r) { return r.text(); })
				.then(function (t) {
					var pre = document.getElementById('nvidia-smi');
					pre.textContent = t;
				})
				.catch(function (e) {
					var pre = document.getElementById('nvidia-smi');
					pre.textContent = 'Erreur de récupération\n' + e.message;
				});
		}
		setInterval(refresh, 2000);

		function restart() {
			var b = document.getElementById('restart');
			b.textContent = 'Relance en cours…';
			var endpoint = '/cgi-bin/restart-llama-serve.sh';
			fetch(endpoint, { cache: 'no-store' })
				.then(function (r) { return r.text(); })
				.then(function (t) {
					b.textContent = 'Relancer llama-serve';
				})
				.catch(function (e) {
					b.textContent = e.message;
				});
		}

	})();
</script>
</head>
<body>
	<pre id="nvidia-smi">Chargement…</pre>
	<button id="restart" onclick="restart()">Relancer llama-serve</button>
</body>
</html>
